[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mois-d-zois"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "yt-dlp>=2024.1",
    "PyNaCl>=1.5",
    "davey>=0.1.6",
    "pydantic>=2",
    "defusedxml>=0.7",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["dependencies*", "orchestrator*", "services*", "slash_commands*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".claude", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["S101", "S105", "S110", "S112", "S311"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true
